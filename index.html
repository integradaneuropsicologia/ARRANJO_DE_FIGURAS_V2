function normalizeCPF(cpf) {
  return String(cpf || "").replace(/\D/g, "");
}

    function getTokenFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return String(params.get("token") || params.get("t") || "").trim();
    }

    function getCpfFromUrl() {
      if (window.__patientFormAccess?.cpf) return normalizeCPF(window.__patientFormAccess.cpf);

      const params = new URLSearchParams(window.location.search);
      const legacyCpf = params.get("cpf");
      if (legacyCpf) return normalizeCPF(legacyCpf);

      const raw = window.location.search.replace("?", "").trim();
      if (/^\d{11}$/.test(raw)) return raw;

      return "";
    }

    function getTestCodeFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("form") || params.get("code") || TEST_CODE_FIXO;
    }

function redirectToAreaPaciente() {
      const token = getTokenFromUrl();
      window.location.href = token ? `${AREA_PACIENTE_URL}?token=${encodeURIComponent(token)}` : AREA_PACIENTE_URL;
    }

function isObject(v) {
  return v && typeof v === "object" && !Array.isArray(v);
}
function containsTestCode(jsonb, testCode) {
  if (!jsonb) return false;
  if (typeof jsonb === "string") return jsonb === testCode;

  if (Array.isArray(jsonb)) {
    return jsonb.some(item => {
      if (typeof item === "string") return item === testCode;
      if (isObject(item)) {
        return item.code === testCode || item.test_code === testCode || item.id === testCode || containsTestCode(item, testCode);
      }
      return false;
    });
  }

  if (isObject(jsonb)) {
    if (Object.prototype.hasOwnProperty.call(jsonb, testCode)) {
      const value = jsonb[testCode];
      if (value !== false && value !== null && value !== undefined) return true;
      return false;
    }
    if (jsonb.code === testCode || jsonb.test_code === testCode || jsonb.id === testCode) return true;
    return Object.values(jsonb).some(v => containsTestCode(v, testCode));
  }

  return false;
}
function isTestLiberado(testsLiberados, testCode) {
  if (!containsTestCode(testsLiberados, testCode)) return false;

  if (isObject(testsLiberados) && Object.prototype.hasOwnProperty.call(testsLiberados, testCode)) {
    const v = testsLiberados[testCode];
    if (typeof v === "boolean") return v;
    if (isObject(v) && "liberado" in v) return Boolean(v.liberado);
    if (typeof v === "string") return !["false", "0", "nao", "não"].includes(v.toLowerCase());
    return Boolean(v);
  }

  return true;
}
function isTestFeito(testsFeitos, testCode) {
  if (!containsTestCode(testsFeitos, testCode)) return false;

  if (isObject(testsFeitos) && Object.prototype.hasOwnProperty.call(testsFeitos, testCode)) {
    const v = testsFeitos[testCode];
    if (typeof v === "boolean") return v;
    if (isObject(v) && "feito" in v) return Boolean(v.feito);
    if (typeof v === "string") return !["false", "0", "nao", "não"].includes(v.toLowerCase());
    return Boolean(v);
  }

  return true;
}
function normalizeTestsFeitosForSave(current) {
  const out = {};
  if (!current) return out;

  if (typeof current === "string") {
    out[current] = { feito: true };
    return out;
  }

  if (Array.isArray(current)) {
    current.forEach(item => {
      if (typeof item === "string") {
        out[item] = { feito: true };
      } else if (isObject(item)) {
        const code = item.code || item.test_code || item.id;
        if (code) {
          out[code] = {
            ...item,
            feito: ("feito" in item) ? Boolean(item.feito) : true
          };
        }
      }
    });
    return out;
  }

  if (isObject(current)) {
    Object.entries(current).forEach(([key, value]) => {
      if (typeof value === "boolean") out[key] = { feito: value };
      else if (typeof value === "string") out[key] = { feito: !["false", "0", "nao", "não"].includes(value.toLowerCase()) };
      else if (isObject(value)) out[key] = { ...value };
      else out[key] = { feito: Boolean(value) };
    });
  }

  return out;
}
function buildUpdatedTestsFeitos(currentTestsFeitos, testCode, submittedAtIso) {
  const next = normalizeTestsFeitosForSave(currentTestsFeitos);

  next[testCode] = {
    ...(isObject(next[testCode]) ? next[testCode] : {}),
    feito: true,
    submitted_at: submittedAtIso
  };

  return next;
}

    async function getPatientFormAccessByToken() {
      const token = getTokenFromUrl();
      const testCode = getTestCodeFromUrl();

      if (!token || !testCode) {
        return { data: null, error: new Error("Link invalido ou formulario nao informado.") };
      }

      if (window.__patientFormAccess && window.__patientFormAccess.form_code === testCode) {
        return { data: window.__patientFormAccess, error: null };
      }

      if (!window.__patientFormAccessPromise) {
        window.__patientFormAccessPromise = supabaseClient
          .rpc("get_public_patient_form_access", {
            p_token: token,
            p_form_code: testCode
          })
          .then(({ data, error }) => {
            if (error) return { data: null, error };
            const row = Array.isArray(data) ? data[0] : data;
            window.__patientFormAccess = row || null;
            return { data: row || null, error: null };
          });
      }

      return window.__patientFormAccessPromise;
    }

    function installPatientTokenAccessShim() {
      if (!supabaseClient || supabaseClient.__patientTokenAccessShim) return;

      const originalFrom = supabaseClient.from.bind(supabaseClient);

      supabaseClient.from = function(table) {
        if (table !== "patients") return originalFrom(table);

        const selectBuilder = {
          select() { return this; },
          eq() { return this; },
          in() { return this; },
          limit() { return this; },
          order() { return this; },
          maybeSingle() { return getPatientFormAccessByToken(); },
          single() { return getPatientFormAccessByToken(); },
          async then(resolve, reject) {
            try {
              const result = await getPatientFormAccessByToken();
              return resolve(result);
            } catch (err) {
              if (reject) return reject(err);
              throw err;
            }
          }
        };

        return {
          select() { return selectBuilder; },
          update() {
            return {
              eq: async () => ({ data: null, error: null })
            };
          }
        };
      };

      supabaseClient.__patientTokenAccessShim = true;
    }

  const cpf = getCpfFromUrl();
  const token = getTokenFromUrl();
  installPatientTokenAccessShim();
  const testCode = getTestCodeFromUrl();

  if (!token) {
    throw new Error("Link invalido ou expirado. Abra o formulario pela area do paciente.");
  }

  const { data, error } = await supabaseClient
    .from("patients")
    .select("cpf, nome, tests_liberados, tests_feitos")
    .eq("cpf", cpf)
    .maybeSingle();

  if (error) {
    console.error(error);
    throw new Error("Erro ao consultar a base de dados.");
  }

  if (!data) {
    throw new Error("CPF não encontrado.");
  }

  const liberado = isTestLiberado(data.tests_liberados, testCode);
  if (!liberado) {
    throw new Error("Teste não liberado.");
  }

  const feito = isTestFeito(data.tests_feitos, testCode);
  if (feito) {
    redirectToAreaPaciente(cpf);
    return null;
  }

  return data;
}

function preloadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(url);
    img.onerror = () => reject(url);
    img.src = url;
  });
}

async function preloadPhaseImages(phase) {
  const cloned = phase.images.map(o => ({ ...o }));
  const results = await Promise.allSettled(cloned.map(i => preloadImage(i.src)));
  results.forEach((r, i) => {
    cloned[i]._src = r.status === "fulfilled" ? r.value : EMPTY_PNG;
  });
  return cloned;
}

function renderCards(order) {
  const area = document.getElementById("cardArea");
  area.innerHTML = "";

  order.forEach((img, idx) => {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.idx = idx;
    card.dataset.id = img.id;

    const image = document.createElement("img");
    image.alt = "Card " + (idx + 1);
    image.crossOrigin = "anonymous";
    image.src = img._src || img.src || EMPTY_PNG;
    card.appendChild(image);

    card.addEventListener("click", () => {
      if (!canInteract) return;

      if (selectedCardIdx === null) {
        selectedCardIdx = idx;
        card.classList.add("selected");
      } else if (selectedCardIdx === idx) {
        card.classList.remove("selected");
        selectedCardIdx = null;
      } else {
        [currentOrder[selectedCardIdx], currentOrder[idx]] =
          [currentOrder[idx], currentOrder[selectedCardIdx]];
        selectedCardIdx = null;
        renderCards(currentOrder);
        enableDragAndDrop();
      }
    });

    area.appendChild(card);
  });

  if (selectedCardIdx !== null) {
    const cards = area.querySelectorAll(".card");
    if (cards[selectedCardIdx]) cards[selectedCardIdx].classList.add("selected");
  }
}

function enableDragAndDrop() {
  let draggedIdx = null;
  const cardEls = document.querySelectorAll(".card");

  cardEls.forEach(card => {
    card.addEventListener("dragstart", e => {
      if (!canInteract) return e.preventDefault();
      e.dataTransfer.setData("text/plain", card.dataset.idx);
      e.dataTransfer.effectAllowed = "move";
      draggedIdx = Number(card.dataset.idx);
      card.classList.add("dragging");
      setTimeout(() => card.classList.add("hide"), 0);
    });

    card.addEventListener("dragend", () => {
      card.classList.remove("dragging", "hide");
    });

    card.addEventListener("dragover", e => {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = "move";
    });

    card.addEventListener("drop", () => {
      if (!canInteract) return;
      const dropIdx = Number(card.dataset.idx);
      if (draggedIdx !== null && dropIdx !== draggedIdx) {
        [currentOrder[draggedIdx], currentOrder[dropIdx]] =
          [currentOrder[dropIdx], currentOrder[draggedIdx]];
        renderCards(currentOrder);
        enableDragAndDrop();
      }
      draggedIdx = null;
    });

    card.addEventListener("touchstart", () => {
      if (!canInteract) return;
      card.classList.add("dragging");
      draggedIdx = Number(card.dataset.idx);
    });

    card.addEventListener("touchend", e => {
      card.classList.remove("dragging");
      const touch = e.changedTouches[0];
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      if (el && el.classList.contains("card")) {
        const dropIdx = Number(el.dataset.idx);
        if (draggedIdx !== null && dropIdx !== draggedIdx) {
          [currentOrder[draggedIdx], currentOrder[dropIdx]] =
            [currentOrder[dropIdx], currentOrder[draggedIdx]];
          renderCards(currentOrder);
          enableDragAndDrop();
        }
      }
      draggedIdx = null;
    });
  });
}

function updateTimer() {
  const txt = "Tempo restante: " + (timeLeft < 10 ? "0" : "") + timeLeft + " segundos";
  document.getElementById("timer").innerText = txt;
}

function checkOrder(forced = false) {
  if (!canInteract && !forced) return;

  clearInterval(timer);
  canInteract = false;
  selectedCardIdx = null;

  const userOrder = currentOrder.map(img => img.id);
  userAnswers[currentPhase] = userOrder.join("|");
  const phase = phases[currentPhase];

  let matched = -1;
  for (let g = 0; g < phase.answerKey.length; g++) {
    if (JSON.stringify(userOrder) === JSON.stringify(phase.answerKey[g])) {
      matched = g;
      break;
    }
  }

  let phaseScore = 0;

  if (currentPhase === 0) {
    if (matched === 0 && attempt === 0) phaseScore = 2;
    else if (matched === 0 && attempt === 1) phaseScore = 1;
  } else {
    if ([4, 6, 7, 8, 10].includes(currentPhase)) {
      if (matched === 0) phaseScore = phase.points[0];
      else if (matched === 1) phaseScore = phase.points[1];
      else if (matched === 2) phaseScore = phase.points[2] || 0;
    } else {
      phaseScore = matched === 0 ? phase.points[0] : 0;
    }

    if (currentPhase === 10) {
      if (matched === 2) phaseScore = 1;
      if (matched === 0 || matched === 1) phaseScore = 2;
    }
  }

  scores[currentPhase] = phaseScore;
  const checkBtn = document.getElementById("checkBtn");
  checkBtn.disabled = true;

  if (currentPhase === 0 && phaseScore === 0 && attempt < 1) {
    attempt++;

    if (forced) {
      setTimeout(() => {
        checkBtn.disabled = false;
        nextPhase();
      }, 600);
    } else {
      setTimeout(() => {
        document.getElementById("feedback").innerText = "Tente novamente!";
        checkBtn.disabled = false;
        canInteract = true;
        timeLeft = phase.time;
        updateTimer();

        timer = setInterval(() => {
          timeLeft--;
          updateTimer();
          if (timeLeft <= 0) {
            clearInterval(timer);
            checkBtn.disabled = true;
            checkOrder(true);
          }
        }, 1000);
      }, 600);
    }
    return;
  }

  setTimeout(() => {
    checkBtn.disabled = false;
    nextPhase();
  }, 800);
}

async function startPhase(idx) {
  if (timer) clearInterval(timer);

  canInteract = false;
  selectedCardIdx = null;
  currentPhase = idx;
  attempt = 0;

  document.getElementById("gameArea").style.display = "block";
  document.getElementById("phaseIndicator").style.display = "block";
  document.getElementById("finalSummary").style.display = "none";
  document.getElementById("instructions").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("checkBtn").style.display = "block";
  document.getElementById("timer").style.display = "block";

  const feedbackEl = document.getElementById("feedback");
  const checkBtn = document.getElementById("checkBtn");
  checkBtn.disabled = true;
  feedbackEl.innerText = "Carregando...";

  const phase = phases[currentPhase];
  const preloaded = await preloadPhaseImages(phase);

  startOrder = preloaded.slice();
  currentOrder = [...startOrder];

  renderCards(currentOrder);
  enableDragAndDrop();

  canInteract = true;
  checkBtn.disabled = false;
  feedbackEl.innerText = "";

  document.getElementById("phaseIndicator").innerText =
    "Fase " + (currentPhase + 1) + " de " + phases.length;

  timeLeft = phase.time;
  updateTimer();

  timer = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timer);
      checkBtn.disabled = true;
      checkOrder(true);
    }
  }, 1000);

  checkBtn.onclick = () => {
    if (!canInteract) return;
    checkOrder();
  };
}

function nextPhase() {
  if (timer) clearInterval(timer);

  if (currentPhase < phases.length - 1) {
    startPhase(currentPhase + 1);
  } else {
    sendResults();
  }
}


function buildResultsPerguntasRespostas() {
  const total = scores.reduce((a, b) => a + b, 0);
  const perguntasRespostas = [];

  for (let i = 0; i < scores.length; i++) {
    perguntasRespostas.push({
      pergunta: `Fase ${i + 1} - Pontuação`,
      resposta: scores[i]
    });

    perguntasRespostas.push({
      pergunta: `Fase ${i + 1} - Ordem respondida`,
      resposta: userAnswers[i] || ""
    });
  }

  perguntasRespostas.push({
    pergunta: "Pontuação total",
    resposta: total
  });

  return perguntasRespostas;
}

async function sendResults() {
  const statusEl = document.getElementById("sendStatus");

  try {
    if (resultsSent) return;

    const cpf = getCpfFromUrl();
    const token = getTokenFromUrl();
    installPatientTokenAccessShim();
    const testCode = getTestCodeFromUrl();
    const submittedAt = new Date().toISOString();
    const total = scores.reduce((a, b) => a + b, 0);

    if (!cpf) throw new Error("CPF inválido.");
    if (!patient) throw new Error("Sessão inválida.");

    document.getElementById("gameArea").style.display = "none";
    document.getElementById("phaseIndicator").style.display = "none";
    document.getElementById("timer").style.display = "none";
    document.getElementById("instructions").style.display = "none";
    document.getElementById("finalSummary").style.display = "block";

    statusEl.textContent = "Salvando respostas...";

    const resultsPayload = buildResultsPerguntasRespostas();

    const { error: insertError } = await supabaseClient
      .from("respostas")
      .insert([
        {
          cpf: cpf,
          code: testCode,
          submitted_at: submittedAt,
          results: resultsPayload,
          results_meta: {
            total_score: total,
            scores: scores,
           
          }
        }
      ]);

    if (insertError) {
      console.error(insertError);
      throw new Error(`Erro ao salvar respostas: ${insertError.message}`);
    }

    const nextTestsFeitos = buildUpdatedTestsFeitos(
      patient.tests_feitos,
      testCode,
      submittedAt
    );

    const { error: updateError } = await supabaseClient
      .from("patients")
      .update({
        tests_feitos: nextTestsFeitos
      })
      .eq("cpf", cpf);

    if (updateError) {
      console.error(updateError);
      throw new Error("Respostas salvas, mas falhou ao marcar teste como feito.");
    }

    resultsSent = true;
    statusEl.textContent = "Teste concluído com sucesso. Redirecionando...";

    setTimeout(() => {
      redirectToAreaPaciente(cpf);
    }, 700);

  } catch (err) {
    console.error(err);
    statusEl.textContent = err.message || "Erro ao enviar.";
    setBox("#alert", err.message || "Erro ao enviar.", "err");
  }
}
document.getElementById("startBtn").onclick = () => {
  startPhase(0);
};



(async function boot() {
  try {
    const data = await validarAcessoAoTeste();
    if (!data) return;

    patient = data;
    CPF = normalizeCPF(data.cpf);
    currentCPF = CPF;

    hideBox("#alert");
    document.body.classList.add("ok");
  } catch (err) {
    console.error(err);
    setBox("#alert", err.message || "Falha ao abrir o formulário.", "err");
  }
})();
</script>
